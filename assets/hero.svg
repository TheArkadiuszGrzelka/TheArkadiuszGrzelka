<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Arkadiusz Grzelka. Embedded firmware, wireless, open source contributor. Hard problems, solved at the root.">
<style>
.name { font: 700 58px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #f4f9fc; }
.mono { font-family: ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace; }
.role { font-size: 19px; fill: #a9c1cf; }
.motto { font-size: 19px; fill: #5cc4f2; }
.trace { fill: none; stroke: #2c5364; stroke-width: 2; }
.signal { fill: none; stroke: #5cc4f2; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 10 90; animation: flow 3.6s linear infinite; }
.labels text { font-size: 15px; fill: #cfe0ea; }
.chip-a { font: 700 44px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #f4f9fc; }
.chip-b { font-size: 11px; letter-spacing: 1.5px; fill: #8fb3c7; }
.cursor { animation: blink 1.2s steps(2) infinite; }
@keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .signal { display: none; } .cursor { animation: none; } }
</style>
